name: Validate Smartify Weather Card

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: weather-card-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate distributable JS syntax
        run: node --check dist/smartify-weather-chart.js
      - name: Validate regression-test syntax
        run: node --check tests/forecast-contract.test.cjs
      - name: Validate version, documentation and HACS metadata
        run: python scripts/check_version.py
      - name: Forecast scrolling and card regression contracts
        run: node --test tests/*.test.cjs
      - name: Validate workflows as YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  data = yaml.safe_load(handle)
              if not isinstance(data, dict) or 'jobs' not in data:
                  raise SystemExit(f'Invalid workflow: {path}')
              print(f'YAML valid: {path}')
          PY
