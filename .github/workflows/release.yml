name: Publish Smartify Weather Card

on:
  push:
    branches: [main]
    paths:
      - dist/smartify-weather-chart.js
      - scripts/**
      - tests/**
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - README.md
      - .github/workflows/release.yml
      - .github/workflows/validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartify-weather-card-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable versioned release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/check_version.py | sed -n 's/^PASS: Smartify Weather Card v\([0-9.]*\) metadata and HACS contract$/\1/p')
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; never overwrite it."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a GitHub release. Manual review required."
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Smartify Weather Card $tag" --notes-file RELEASE_NOTES.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
